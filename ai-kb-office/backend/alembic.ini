# Alembic 配置（任务 T0.5：迁移可执行、可回滚）
[alembic]
script_location = alembic
prepend_sys_path = .
# 实际连接串在 env.py 中由应用配置注入，此处仅占位
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/ai_kb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
